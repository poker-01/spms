server:
  port: 8080

spring:
  application:
    name: spms
  profiles:
    active: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/spms?characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root

  #Jackson 时间格式化
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  sql:
    init:
      data-locations: classpath:db/property-admin-init.sql
      mode: always

#MyBatis-Plus 配置
mybatis-plus:
  configuration:
    #开启日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    #驼峰命名自动映射
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      #逻辑删除全局配置
      logic-delete-field: is_deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      #主键自增
      id-type: auto
  #mapper.xml 文件位置
  mapper-locations: classpath*:mapper/**/*.xml
  #实体类包路径
  type-aliases-package: com.example.spms.model.po

logging:
  level:
    com.example.spms: debug
    com.example.spms.mapper: debug

# JWT 配置
jwt:
  secret: spms-jwt-secret-key-2026-smart-property-management-system
  expiration: 86400000  # 24小时(毫秒)